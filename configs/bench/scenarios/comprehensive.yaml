name: comprehensive
description: Comprehensive benchmark covering UDP, HTTP, and rate-limited scenarios

defaults:
  duration: 2m
  concurrency: 64
  seed: 2048
  rate: 0

runs:
  - name: udp-sweep
    mode: udp
    routines: [1, 2, 4, 8, 16, 32, 64]
    other_routines: 1

  - name: http-sweep
    mode: http
    routines: [1, 2, 4, 8, 16, 32]
    other_routines: 1

  - name: udp-rate-limited
    mode: udp
    routines: [4, 8, 16]
    other_routines: 1
    overrides:
      rate: 10000
      duration: 1m

  - name: udp-high-concurrency
    mode: udp
    routines: [8, 16, 32]
    other_routines: 1
    overrides:
      concurrency: 512
